<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srinjoy Chatterjee | Alex AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(234, 179, 8, 0.4), inset 0 0 15px rgba(234, 179, 8, 0.2); }
            50% { box-shadow: 0 0 40px rgba(234, 179, 8, 0.8), inset 0 0 25px rgba(234, 179, 8, 0.5); }
        }
        .orb-active { animation: pulse-glow 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl text-center space-y-6">
        
        <!-- Header -->
        <div>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-medium mb-3">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Alex - Professional AI Agent
            </span>
            <h1 class="text-2xl font-black text-yellow-400">Srinjoy's Voice Assistant</h1>
            <p class="text-xs text-slate-400 mt-1">Powered by your complete resume knowledge base[cite: 1]. Just start speaking—Alex will listen and answer.</p>
        </div>

        <!-- Glowing Voice Orb UI -->
        <div class="relative flex items-center justify-center py-6">
            <div id="voiceOrb" onclick="toggleAgent()" class="w-28 h-28 bg-slate-900 border-2 border-yellow-500 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 shadow-2xl">
                <i id="orbIcon" class="fa-solid fa-microphone text-yellow-400 text-3xl"></i>
            </div>
            <div id="orbRipple" class="absolute w-36 h-36 rounded-full border border-yellow-500/30 pointer-events-none hidden animate-ping"></div>
        </div>

        <!-- Dynamic Status Display -->
        <div id="agentStatus" class="bg-slate-900/80 border border-slate-700 rounded-2xl p-4 text-xs text-slate-300 min-h-[90px] flex flex-col items-center justify-center space-y-1">
            <span class="text-yellow-400 font-bold">Tap the orb to start conversation with Alex</span>
        </div>

        <!-- Control Button -->
        <div>
            <button onclick="toggleAgent()" id="actionBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-play"></i> Start Alex
            </button>
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('agentStatus');
        const voiceOrb = document.getElementById('voiceOrb');
        const orbRipple = document.getElementById('orbRipple');
        const orbIcon = document.getElementById('orbIcon');
        const actionBtn = document.getElementById('actionBtn');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isRunning = false;
        let selectedVoice = null;

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            selectedVoice = voices.find(v => v.name.includes('Google UK English Male') || v.name.includes('Microsoft David') || v.name.includes('Ryan') || (v.lang.includes('en') && v.name.toLowerCase().includes('male'))) 
                         || voices.find(v => v.lang.startsWith('en')) 
                         || voices[0];
        }

        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                if (isRunning) setUIState('listening', 'Listening... Speak your question now.');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                }

                setUIState('thinking', `You asked: "${transcript}"`);
                generateSmartAnswer(transcript);
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech' && isRunning) {
                    restartListeningSafely();
                }
            };
        } else {
            alert("Speech recognition requires Chrome, Edge, or Safari.");
        }

        function toggleAgent() {
            if (!isRunning) {
                isRunning = true;
                actionBtn.innerHTML = `<i class="fa-solid fa-stop"></i> Stop Alex`;
                playGreeting();
            } else {
                stopAgent();
            }
        }

        function playGreeting() {
            const greeting = "Hello, I am Alex, Srinjoy Chatterjee's professional AI assistant. Ask me anything about his experience as a Dynamics 365 Architect[cite: 1], his work at Microsoft[cite: 1], or his technical skills[cite: 1].";
            setUIState('speaking', greeting);
            speakAsAlex(greeting, () => {
                restartListeningSafely();
            });
        }

        function restartListeningSafely() {
            if (!isRunning) return;
            setTimeout(() => {
                try {
                    recognition.start();
                } catch (e) {
                    // Ignore if already active
                }
            }, 400);
        }

        function generateSmartAnswer(query) {
            let reply = "";

            if (query.includes("altamed") || (query.includes("current") && query.includes("job")) || query.includes("present")) {
                reply = "Srinjoy is currently a Dynamics 365 CRM Architect at AltaMed Health Services[cite: 1], where he designs system solutions, manages Dataverse integrations, and writes C# .NET plugins[cite: 1].";
            } else if (query.includes("microsoft")) {
                reply = "At Microsoft, Srinjoy worked as a Software Engineer via Brooksource from August 2022 to July 2023[cite: 1], building web applications that powered global Azure data center construction workflows using C#, Python, and Azure DevOps[cite: 1].";
            } else if (query.includes("foundation") || query.includes("fbm") || query.includes("building materials")) {
                reply = "He was a Software Engineer at Foundation Building Materials from August 2023 to December 2024[cite: 1], building custom Sales CRM apps, lead assignment rules, and cross-platform ERP integrations[cite: 1].";
            } else if (query.includes("toshiba") || query.includes("esuite") || query.includes("printing")) {
                reply = "At Toshiba Software India from 2017 to 2020[cite: 1], Srinjoy developed eSuite, a printing management software hosted on web and Multi-Functional Peripherals using .NET and Java for international clients[cite: 1].";
            } else if (query.includes("education") || query.includes("degree") || query.includes("university") || query.includes("long beach") || query.includes("vit")) {
                reply = "Srinjoy holds a Master's in Computer Science from Long Beach State University[cite: 1] and a Bachelor's in Computer Science and Engineering from VIT Vellore[cite: 1].";
            } else if (query.includes("skill") || query.includes("technology") || query.includes("c#") || query.includes("dynamics") || query.includes("plugin") || query.includes("javascript")) {
                reply = "His core technical skills include Dynamics 365 CRM Sales, C# .NET framework custom plugins, JavaScript, Power Automate, Power Pages, Python, SQL, and SSMS[cite: 1].";
            } else if (query.includes("research") || query.includes("paper") || query.includes("malaria")) {
                reply = "Srinjoy published a research paper titled Detection of Malaria Parasites in Thin Blood Smears Using a CNN-Based Approach, published with Springer[cite: 1].";
            } else if (query.includes("project") || query.includes("autonomous") || query.includes("spam")) {
                reply = "Key projects include an autonomous vehicles safety project using AWS IoT Greengrass, and a final-year security evaluation project classifying spam using Bayes Theorem in C# .NET[cite: 1].";
            } else if (query.includes("contact") || query.includes("email") || query.includes("phone")) {
                reply = "You can contact Srinjoy via email at srinjoyc94@gmail.com[cite: 1], by phone at 562-514-2898[cite: 1], or through the contact form on this website.";
            } else {
                reply = "Srinjoy is an accomplished Dynamics 365 Architect with enterprise experience at Microsoft and AltaMed[cite: 1]. You can ask me about his work history, C# plugin expertise[cite: 1], or education[cite: 1].";
            }

            setUIState('speaking', reply);
            speakAsAlex(reply, () => {
                restartListeningSafely();
            });
        }

        function speakAsAlex(text, callback) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
            utterance.rate = 1.0;
            utterance.pitch = 0.95;

            utterance.onend = () => {
                if (callback) callback();
            };

            window.speechSynthesis.speak(utterance);
        }

        function setUIState(state, message) {
            statusBox.dataset.state = state;
            if (state === 'listening') {
                voiceOrb.classList.add('orb-active');
                orbRipple.classList.remove('hidden');
                orbIcon.className = "fa-solid fa-microphone-lines text-yellow-400 text-3xl animate-pulse";
                statusBox.innerHTML = `<span class="text-emerald-400 font-bold animate-pulse">Alex is listening...</span><span class="text-slate-300 mt-1">${message}</span>`;
            } else if (state === 'speaking') {
                voiceOrb.classList.add('orb-active');
                orbRipple.classList.remove('hidden');
                orbIcon.className = "fa-solid fa-volume-high text-yellow-400 text-3xl animate-bounce";
                statusBox.innerHTML = `<span class="text-yellow-400 font-bold">Alex Speaking:</span><span class="text-slate-300 mt-1">${message}</span>`;
            } else if (state === 'thinking') {
                voiceOrb.classList.remove('orb-active');
                orbRipple.classList.add('hidden');
                orbIcon.className = "fa-solid fa-brain text-yellow-400 text-3xl animate-spin";
                statusBox.innerHTML = `<span class="text-blue-400 font-bold">Alex thinking...</span><span class="text-slate-300 mt-1">${message}</span>`;
            } else {
                voiceOrb.classList.remove('orb-active');
                orbRipple.classList.add('hidden');
                orbIcon.className = "fa-solid fa-microphone text-yellow-400 text-3xl";
                statusBox.innerHTML = `<span class="text-yellow-400 font-bold">Ready</span><span class="text-slate-300 mt-1">${message}</span>`;
            }
        }

        function stopAgent() {
            isRunning = false;
            window.speechSynthesis.cancel();
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }
            actionBtn.innerHTML = `<i class="fa-solid fa-play"></i> Start Alex`;
            setUIState('idle', 'Tap the orb to start conversation with Alex.');
        }
    </script>
</body>
</html>
