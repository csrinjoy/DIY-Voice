<script>
    const statusBox = document.getElementById('agentStatus');
    const voiceOrb = document.getElementById('voiceOrb');
    const orbRipple = document.getElementById('orbRipple');
    const orbIcon = document.getElementById('orbIcon');
    const actionBtn = document.getElementById('actionBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRunning = false;
    let selectedVoice = null;

    // Load available voices and select a professional male English voice
    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        selectedVoice = voices.find(v => v.name.includes('Google UK English Male') || v.name.includes('Microsoft David') || v.name.includes('Ryan') || (v.lang.includes('en') && v.name.toLowerCase().includes('male'))) 
                     || voices.find(v => v.lang.startsWith('en')) 
                     || voices[0];
    }

    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false; // Set to false so it stops listening immediately when you finish a sentence
        recognition.maxAlternatives = 1;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            if (isRunning) setUIState('listening', 'Listening... Speak your question now.');
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase().trim();
            
            // Barge-in check: stop speaking if Alex was talking
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }

            setUIState('thinking', `You asked: "${transcript}"`);
            generateSmartAnswer(transcript);
        };

        recognition.onerror = (event) => {
            console.log("Speech recognition event:", event.error);
            if (event.error === 'no-speech' && isRunning) {
                // If user didn't say anything, restart listening gracefully
                restartListeningSafely();
            }
        };

        recognition.onend = () => {
            // Handled explicitly inside answer flow to prevent loops
        };
    } else {
        alert("Speech recognition requires Chrome, Edge, or Safari.");
    }

    function toggleAgent() {
        if (!isRunning) {
            isRunning = true;
            actionBtn.innerHTML = `<i class="fa-solid fa-stop"></i> Stop Alex`;
            playGreeting();
        } else {
            stopAgent();
        }
    }

    function playGreeting() {
        const greeting = "Hello, I am Alex, Srinjoy Chatterjee's professional AI assistant. Ask me anything about his experience as a Dynamics 365 Architect, his work at Microsoft, or his technical skills.";
        setUIState('speaking', greeting);
        speakAsAlex(greeting, () => {
            restartListeningSafely();
        });
    }

    function restartListeningSafely() {
        if (!isRunning) return;
        setTimeout(() => {
            try {
                recognition.start();
            } catch (e) {
                // Ignore if already active
            }
        }, 400);
    }

    // Direct, to-the-point keyword matcher based on your resume
    function generateSmartAnswer(query) {
        let reply = "";

        if (query.includes("altamed") || (query.includes("current") && query.includes("job")) || query.includes("present")) {
            reply = "Srinjoy is currently a Dynamics 365 CRM Architect at AltaMed Health Services, where he designs system solutions, manages Dataverse integrations, and writes C# .NET plugins.";
        } else if (query.includes("microsoft")) {
            reply = "At Microsoft, Srinjoy worked as a Software Engineer via Brooksource from August 2022 to July 2023, building web applications that powered global Azure data center construction workflows using C#, Python, and Azure DevOps.";
        } else if (query.includes("foundation") || query.includes("fbm") || query.includes("building materials")) {
            reply = "He was a Software Engineer at Foundation Building Materials from August 2023 to December 2024, building custom Sales CRM apps, lead assignment rules, and cross-platform ERP integrations.";
        } else if (query.includes("toshiba") || query.includes("esuite") || query.includes("printing")) {
            reply = "At Toshiba Software India from 2017 to 2020, Srinjoy developed eSuite, a printing management software hosted on web and Multi-Functional Peripherals using .NET and Java for international clients.";
        } else if (query.includes("education") || query.includes("degree") || query.includes("university") || query.includes("long beach") || query.includes("vit")) {
            reply = "Srinjoy holds a Master's in Computer Science from Long Beach State University and a Bachelor's in Computer Science and Engineering from VIT Vellore.";
        } else if (query.includes("skill") || query.includes("technology") || query.includes("c#") || query.includes("dynamics") || query.includes("plugin") || query.includes("javascript")) {
            reply = "His core technical skills include Dynamics 365 CRM Sales, C# .NET framework custom plugins, JavaScript, Power Automate, Power Pages, Python, SQL, and SSMS.";
        } else if (query.includes("research") || query.includes("paper") || query.includes("malaria")) {
            reply = "Srinjoy published a research paper titled Detection of Malaria Parasites in Thin Blood Smears Using a CNN-Based Approach, published with Springer.";
        } else if (query.includes("project") || query.includes("autonomous") || query.includes("spam")) {
            reply = "Key projects include an autonomous vehicles safety project using AWS IoT Greengrass, and a final-year security evaluation project classifying spam using Bayes Theorem in C# .NET.";
        } else if (query.includes("contact") || query.includes("email") || query.includes("phone")) {
            reply = "You can contact Srinjoy via email at srinjoyc94@gmail.com, by phone at 562-514-2898, or through the contact form on this page.";
        } else {
            reply = "Srinjoy is an accomplished Dynamics 365 Architect with enterprise experience at Microsoft and AltaMed. You can ask me about his work history, C# plugin expertise, or education.";
        }

        setUIState('speaking', reply);
        speakAsAlex(reply, () => {
            restartListeningSafely();
        });
    }

    function speakAsAlex(text, callback) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        
        if (selectedVoice) {
            utterance.voice = selectedVoice;
        }
        utterance.rate = 1.0;
        utterance.pitch = 0.95;

        utterance.onend = () => {
            if (callback) callback();
        };

        window.speechSynthesis.speak(utterance);
    }

    function setUIState(state, message) {
        statusBox.dataset.state = state;
        if (state === 'listening') {
            voiceOrb.classList.add('orb-active');
            orbRipple.classList.remove('hidden');
            orbIcon.className = "fa-solid fa-microphone-lines text-yellow-400 text-3xl animate-pulse";
            statusBox.innerHTML = `<span class="text-emerald-400 font-bold animate-pulse">Alex is listening...</span><span class="text-slate-300 mt-1">${message}</span>`;
        } else if (state === 'speaking') {
            voiceOrb.classList.add('orb-active');
            orbRipple.classList.remove('hidden');
            orbIcon.className = "fa-solid fa-volume-high text-yellow-400 text-3xl animate-bounce";
            statusBox.innerHTML = `<span class="text-yellow-400 font-bold">Alex Speaking:</span><span class="text-slate-300 mt-1">${message}</span>`;
        } else if (state === 'thinking') {
            voiceOrb.classList.remove('orb-active');
            orbRipple.classList.add('hidden');
            orbIcon.className = "fa-solid fa-brain text-yellow-400 text-3xl animate-spin";
            statusBox.innerHTML = `<span class="text-blue-400 font-bold">Alex thinking...</span><span class="text-slate-300 mt-1">${message}</span>`;
        } else {
            voiceOrb.classList.remove('orb-active');
            orbRipple.classList.add('hidden');
            orbIcon.className = "fa-solid fa-microphone text-yellow-400 text-3xl";
            statusBox.innerHTML = `<span class="text-yellow-400 font-bold">Ready</span><span class="text-slate-300 mt-1">${message}</span>`;
        }
    }

    function stopAgent() {
        isRunning = false;
        window.speechSynthesis.cancel();
        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
        actionBtn.innerHTML = `<i class="fa-solid fa-play"></i> Start Alex`;
        setUIState('idle', 'Tap the orb to start conversation with Alex.');
    }
</script>
