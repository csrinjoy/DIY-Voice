<script>
    const statusBox = document.getElementById('agentStatus');
    const voiceOrb = document.getElementById('voiceOrb');
    const orbRipple = document.getElementById('orbRipple');
    const orbIcon = document.getElementById('orbIcon');
    const actionBtn = document.getElementById('actionBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRunning = false;

    // Resume Knowledge Base
    const kb = `
    Name: Srinjoy Chatterjee. 
    Role: Microsoft Dynamics 365 CE Developer and Architect. 
    Current Job: Dynamics 365 CRM Architect at AltaMed Health Services since December 2024, focusing on C# .NET plugins, Dataverse integrations, and Power BI dashboards.
    Past Experience: Software Engineer at Foundation Building Materials (2023-2024), Software Engineer at Microsoft (2022-2023) working on Azure data center web applications, and Software Developer at Toshiba Software India (2017-2020) building eSuite printing management apps.
    Education: MS in Computer Science from Long Beach State University (2022), B.Tech in CSE from VIT Vellore (2017).
    Skills: D365 CE, C#, .NET WebAPI plugins, JavaScript, Power Automate, Power Pages, Agentic AI, SSMS, Python.
    `;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            if (isRunning) {
                setUIState('listening', 'Listening... Speak your question now.');
            }
        };

        recognition.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript.toLowerCase();
            setUIState('thinking', `You asked: "${userSpeech}"`);
            processAnswer(userSpeech);
        };

        recognition.onerror = (event) => {
            // Ignore benign abort errors when stopping speech manually
            if (event.error !== 'aborted' && isRunning) {
                console.warn("Speech recognition warning:", event.error);
                // Gracefully fallback to ready state instead of locking up
                setUIState('idle', 'Tap the orb to speak.');
            }
        };

        recognition.onend = () => {
            // Keep loop alive if agent is running and not currently speaking
            if (isRunning && statusBox.dataset.state === 'listening') {
                setUIState('idle', 'Tap the orb if you want to say something else.');
            }
        };
    } else {
        alert("Speech recognition requires Chrome, Edge, or Safari.");
    }

    function toggleConversation() {
        if (!isRunning) {
            isRunning = true;
            actionBtn.innerHTML = `<i class="fa-solid fa-stop"></i> Stop Agent`;
            playGreeting();
        } else {
            stopAll();
        }
    }

    function playGreeting() {
        const greeting = "Hi there! I am Srinjoy's custom AI voice assistant. Ask me anything about his experience at Microsoft, his work as a Dynamics 365 architect, or his technical skills.";
        setUIState('speaking', greeting);
        
        speakText(greeting, () => {
            // Wait 600ms after audio finishes before safely turning on the mic
            setTimeout(() => {
                if (isRunning) startListening();
            }, 600);
        });
    }

    function startListening() {
        if (!recognition || !isRunning) return;
        try {
            recognition.start();
        } catch (e) {
            // Safe catch if recognition is already running
        }
    }

    function processAnswer(query) {
        let answer = "";

        if (query.includes("experience") || query.includes("work") || query.includes("job") || query.includes("altamed") || query.includes("microsoft")) {
            answer = "Srinjoy is currently a Dynamics 365 CRM Architect at AltaMed. Previously, he engineered web apps for Azure data centers at Microsoft, and worked at Foundation Building Materials and Toshiba.";
        } else if (query.includes("skill") || query.includes("technology") || query.includes("code") || query.includes("c#") || query.includes("javascript")) {
            answer = "His core stack includes Microsoft Dynamics 365 CE, C# .NET custom plugins, JavaScript, Power Automate, Power Pages, Python, and Agentic AI solutions.";
        } else if (query.includes("education") || query.includes("study") || query.includes("degree") || query.includes("university")) {
            answer = "He earned his Master's in Computer Science from Long Beach State University in 2022 and his B.Tech in Computer Science from VIT Vellore.";
        } else if (query.includes("hello") || query.includes("hi")) {
            answer = "Hello! How can I help you learn more about Srinjoy's professional background today?";
        } else {
            answer = "That's a great question about Srinjoy's background. He specializes in enterprise CRM architecture and full-stack development. You can also review his interactive resume or contact him directly on this page.";
        }

        setUIState('speaking', answer);
        speakText(answer, () => {
            // Wait 600ms after answer finishes before reopening mic loop
            setTimeout(() => {
                if (isRunning) startListening();
            }, 600);
        });
    }

    function speakText(text, callback) {
        window.speechSynthesis.cancel(); // Stop any overlapping speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.05;
        utterance.pitch = 1.0;

        utterance.onend = () => {
            if (callback) callback();
        };

        window.speechSynthesis.speak(utterance);
    }

    function setUIState(state, message) {
        statusBox.dataset.state = state;
        if (state === 'listening') {
            voiceOrb.classList.add('orb-active');
            orbRipple.classList.remove('hidden');
            orbIcon.className = "fa-solid fa-microphone-lines text-yellow-400 text-3xl animate-pulse";
            statusBox.innerHTML = `<span class="text-emerald-400 font-bold animate-pulse">Listening...</span><span class="text-slate-300 mt-1">${message}</span>`;
        } else if (state === 'speaking') {
            voiceOrb.classList.add('orb-active');
            orbRipple.classList.remove('hidden');
            orbIcon.className = "fa-solid fa-volume-high text-yellow-400 text-3xl animate-bounce";
            statusBox.innerHTML = `<span class="text-yellow-400 font-bold">Agent Speaking:</span><span class="text-slate-300 mt-1">${message}</span>`;
        } else if (state === 'thinking') {
            voiceOrb.classList.remove('orb-active');
            orbRipple.classList.add('hidden');
            orbIcon.className = "fa-solid fa-brain text-yellow-400 text-3xl animate-spin";
            statusBox.innerHTML = `<span class="text-blue-400 font-bold">Processing...</span><span class="text-slate-300 mt-1">${message}</span>`;
        } else {
            voiceOrb.classList.remove('orb-active');
            orbRipple.classList.add('hidden');
            orbIcon.className = "fa-solid fa-microphone text-yellow-400 text-3xl";
            statusBox.innerHTML = `<span class="text-yellow-400 font-bold">Ready</span><span class="text-slate-300 mt-1">${message}</span>`;
        }
    }

    function stopAll() {
        isRunning = false;
        window.speechSynthesis.cancel();
        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
        actionBtn.innerHTML = `<i class="fa-solid fa-play"></i> Start Agent`;
        setUIState('idle', 'Tap the orb to start conversation.');
    }
</script>
